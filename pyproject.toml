[project]
name = "chromatic-echo"
version = "0.1.0"
description = "An interactive image-to-sound experience using colour analysis and procedural audio synthesis."
readme = "README.md"
authors = [
    { name = "Guo ZiJun", email = "26082604g@connect.polyu.hk" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
